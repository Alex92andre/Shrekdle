<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;900&family=Alegreya:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f3e8c9;--gold:#e7b64f;--gold2:#f6d98a;--parch:#efe1bd;--ink:#3a2a18}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0d1508}
body{font-family:'Alegreya',Georgia,serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.backdrop{position:fixed;inset:-24px;background:var(--bg) center/cover;filter:blur(14px) brightness(.5);z-index:0;image-rendering:auto}
.vp{z-index:1;position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.vp::-webkit-scrollbar{display:none}
.world{position:relative;background:var(--bg) center/100% 100% no-repeat;image-rendering:pixelated;transition-property:none}
.px{image-rendering:pixelated;display:block;width:100%;height:100%}
.abs{position:absolute;pointer-events:none}
.hs{position:absolute;display:block;text-decoration:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:3}
.hs:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.tip{position:absolute;transform:translate(-50%,calc(-100% + 6px)) scale(.9);padding:6px 16px;border-radius:12px 16px 12px 16px;background:var(--parch);color:var(--ink);border:2px solid #8a6a3a;font:900 clamp(14px,1.55vw,26px)/1.1 'Grenze Gotisch',serif;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 18px rgba(0,0,0,.45);z-index:9}
.tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#8a6a3a;border-bottom:none}
.hs:hover+.tip,.hs:focus-visible+.tip{opacity:1;transform:translate(-50%,-100%) scale(1)}
.spark{position:absolute;width:.5%;aspect-ratio:1;background:#fff3b0;box-shadow:0 0 12px 4px rgba(255,214,90,.7);border-radius:50%;animation:tw 2.6s ease-in-out infinite;pointer-events:none;z-index:5}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.shd{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(14,8,2,.62),rgba(14,8,2,.28) 55%,transparent 72%);z-index:1;pointer-events:none}
.oh{filter:brightness(.9) contrast(1.05);transition:filter .25s,transform .25s}
.oh .f,.oh .d{position:absolute}
.oh .f{inset:0}
.oh .d{left:34.615%;top:22.222%;width:42.308%;height:57.143%;transform-origin:100% 50%;transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
.oh:hover,.oh:focus-visible{filter:brightness(1.05) drop-shadow(0 0 14px rgba(255,214,120,.85));transform:translateY(-4px)}
.oh:hover .d,.oh:focus-visible .d{transform:perspective(500px) rotateY(-42deg)}
.dn img{transform-origin:50% 100%;animation:br 3.6s ease-in-out infinite;transition:filter .25s;filter:brightness(.9) contrast(1.05)}
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.985)}}
.dn:hover img,.dn:focus-visible img{filter:drop-shadow(0 0 10px rgba(255,214,120,.9)) brightness(1.1);animation:hop .5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.door{border-radius:42% 42% 4% 4% / 30% 30% 4% 4%;transition:box-shadow .3s,background .3s}
.door:hover,.door:focus-visible{background:radial-gradient(ellipse at 50% 70%,rgba(255,214,120,.5),rgba(255,190,80,.14) 70%,transparent);box-shadow:0 0 38px 8px rgba(255,200,90,.55),inset 0 0 26px rgba(255,214,120,.55)}
.sil{pointer-events:none;z-index:2}
.sil .clip{position:absolute;inset:0;pointer-events:auto;clip-path:inset(0 0 0 36%);cursor:pointer;transition:transform .4s cubic-bezier(.3,1.3,.4,1)}
.sil:hover .clip,.sil:focus-visible .clip{transform:translateX(7%)}
.sil:hover .clip img{filter:drop-shadow(0 0 5px rgba(255,200,110,.7))}
.fly{position:absolute;width:.28%;aspect-ratio:1;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(246,196,83,.55);pointer-events:none;z-index:5;animation:fd var(--d) ease-in-out var(--dl) infinite,ff 2.8s ease-in-out var(--dl) infinite}
@keyframes fd{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--a),calc(var(--a)*-.8))}}
@keyframes ff{0%,100%{opacity:.15}45%{opacity:1}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:20;background:radial-gradient(120% 90% at 50% 60%,transparent 55%,rgba(6,9,3,.5) 100%)}
/* Le titre et la cheminée partagent les coordonnées de la scène (1920 × 1080). */
.ttl{
  --ttl-baseline:calc(var(--u)*232 + var(--scene-top-crop,0px)*.35);
  --ttl-top-gap:clamp(8px,1.45vh,20px);
  --ttl-fit-width:calc((var(--ttl-baseline) - var(--scene-top-crop,0px) - var(--ttl-top-gap))*920/178);
  --ttl-shadow:drop-shadow(0 0 calc(var(--u)*1.4) rgba(209,226,156,.54)) drop-shadow(0 calc(var(--u)*5) calc(var(--u)*11) rgba(20,10,0,.75));
  position:absolute;left:52.708333%;bottom:calc(100% - var(--ttl-baseline));
  /* Le grand S pèse visuellement plus que les lettres de droite. */
  transform:translateX(-48%);display:block;width:max(0px,min(47.5%,88vw,1100px,var(--ttl-fit-width)));
  height:auto;z-index:2;pointer-events:none;image-rendering:auto;filter:var(--ttl-shadow)
}
@media (max-width:767px) and (orientation:portrait){
  .ttl{--ttl-baseline:calc(var(--u)*210);width:max(0px,min(88vw,440px,var(--ttl-fit-width)));transform:translateX(-50%)}
}
@media (hover:hover) and (pointer:fine){
  .ttl{pointer-events:auto;filter:brightness(var(--ttl-brightness,1)) drop-shadow(0 0 calc(var(--u)*13) rgb(175 218 106 / var(--ttl-halo,0))) var(--ttl-shadow);transition:filter .44s ease-in-out}
  .ttl:hover{--ttl-brightness:1.1;--ttl-halo:.55}
}
.hint{position:absolute;width:max(30px,calc(var(--u)*46));aspect-ratio:1;transform:translate(-50%,-100%);display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbf0cf,#e9d49a);border:2px solid #8a6a3a;box-shadow:0 5px 12px rgba(0,0,0,.45),0 0 14px rgba(255,214,120,.45);pointer-events:none;z-index:8;animation:bob 2.2s ease-in-out infinite;transition:opacity .2s}
.hint::before,.hint::after{content:"";position:absolute;border-radius:50%;background:#e9d49a;border:1.5px solid #8a6a3a}
.hint::before{width:26%;aspect-ratio:1;left:50%;bottom:-24%;transform:translateX(-30%)}
.hint::after{width:15%;aspect-ratio:1;left:58%;bottom:-42%}
.hint svg{width:58%;fill:#3a2a18;animation:tap 2.2s ease-in-out infinite;transform-origin:30% 20%}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:calc(var(--u)*-9)}}
@keyframes tap{0%,60%,100%{transform:scale(1)}72%{transform:scale(.8) translate(1px,2px)}84%{transform:scale(1)}}
.hs:hover+.tip+.hint,.hs:focus-visible+.tip+.hint{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
