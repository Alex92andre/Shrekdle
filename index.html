<style>
:root{--cream:#f3e8c9;--gold:#e7b64f;--gold2:#f6d98a;--parch:#efe1bd;--ink:#3a2a18;--w:max(100vw,177.78vh)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0d1508}
body{font-family:'Alegreya',Georgia,serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.vp{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.vp::-webkit-scrollbar{display:none}
.world{position:relative;width:var(--w);height:calc(var(--w)*.5625);margin-top:min(0px,calc(100vh - var(--w)*.5625));background:var(--bg) center/100% 100% no-repeat;image-rendering:pixelated}
.px{image-rendering:pixelated;display:block;width:100%;height:100%}
.hs{position:absolute;display:block;text-decoration:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hs:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.tip{position:absolute;left:50%;bottom:100%;transform:translate(-50%,6px) scale(.9);margin-bottom:10px;padding:6px 16px;border-radius:12px 16px 12px 16px;background:var(--parch);color:var(--ink);border:2px solid #8a6a3a;font:900 clamp(14px,1.55vw,26px)/1.1 'Grenze Gotisch',serif;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 18px rgba(0,0,0,.45);z-index:6}
.tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#8a6a3a;border-bottom:none}
.hs:hover .tip,.hs:focus-visible .tip{opacity:1;transform:translate(-50%,0) scale(1)}
.spark{position:absolute;width:.5%;aspect-ratio:1;background:#fff3b0;box-shadow:0 0 12px 4px rgba(255,214,90,.7);border-radius:50%;animation:tw 2.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.oh{filter:drop-shadow(0 6px 4px rgba(20,10,0,.55));transition:filter .25s,transform .25s}
.oh .f,.oh .d{position:absolute}
.oh .f{inset:0}
.oh .d{left:34.615%;top:22.222%;width:42.308%;height:57.143%;transform-origin:100% 50%;transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
.oh:hover,.oh:focus-visible{filter:drop-shadow(0 0 14px rgba(255,214,120,.85)) drop-shadow(0 6px 4px rgba(20,10,0,.5));transform:translateY(-4px)}
.oh:hover .d,.oh:focus-visible .d{transform:perspective(500px) rotateY(-42deg)}
.dn img{transform-origin:50% 100%;animation:br 3.6s ease-in-out infinite;transition:filter .25s}
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.985)}}
.dn:hover img,.dn:focus-visible img{filter:drop-shadow(0 0 10px rgba(255,214,120,.9)) brightness(1.12);animation:hop .5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.door{border-radius:42% 42% 4% 4% / 30% 30% 4% 4%;transition:box-shadow .3s,background .3s}
.door:hover,.door:focus-visible{background:radial-gradient(ellipse at 50% 70%,rgba(255,214,120,.5),rgba(255,190,80,.14) 70%,transparent);box-shadow:0 0 38px 8px rgba(255,200,90,.55),inset 0 0 26px rgba(255,214,120,.55)}
.sil{transition:transform .35s cubic-bezier(.3,1.4,.4,1)}
.sil .clip{position:absolute;inset:0;clip-path:inset(0 0 0 26%)}
.sil img{position:absolute;inset:0}
.sil .eyes{animation:bl 5s infinite;transition:filter .3s}
@keyframes bl{0%,92%,100%{opacity:1}95%{opacity:0}}
.sil:hover,.sil:focus-visible{transform:translateX(9%)}
.sil:hover .eyes,.sil:focus-visible .eyes{filter:drop-shadow(0 0 6px #ffd65a) brightness(1.4);animation:none}
.fly{position:absolute;width:.28%;aspect-ratio:1;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(246,196,83,.55);pointer-events:none;animation:fd var(--d) ease-in-out var(--dl) infinite,ff 2.8s ease-in-out var(--dl) infinite}
@keyframes fd{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--a),calc(var(--a)*-.8))}}
@keyframes ff{0%,100%{opacity:.15}45%{opacity:1}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 60%,transparent 55%,rgba(6,9,3,.55) 100%),linear-gradient(rgba(6,9,3,.5),transparent 28%)}
h1{position:fixed;top:clamp(10px,3.5vh,40px);left:0;right:0;text-align:center;pointer-events:none;font-family:'Grenze Gotisch',serif;font-weight:900;font-size:clamp(54px,10vw,128px);line-height:.95;text-shadow:0 3px 26px rgba(0,0,0,.75);z-index:5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
