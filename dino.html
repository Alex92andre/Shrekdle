<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;900&family=Alegreya:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f3e8c9;--gold:#e7b64f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1207}
body{font-family:'Alegreya',Georgia,serif;color:var(--cream);-webkit-user-select:none;user-select:none}
#gameCv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer;display:block}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;pointer-events:none;background:linear-gradient(rgba(8,12,4,.7),transparent)}
.bar>*{pointer-events:auto}
.nav-btn{display:inline-flex;align-items:center;padding:8px 16px;border:1px solid rgba(243,232,201,.35);border-radius:999px;background:rgba(12,16,6,.6);color:var(--cream);font-weight:700;text-decoration:none;backdrop-filter:blur(3px);transition:.15s}
.nav-btn:hover{background:rgba(231,182,79,.2);border-color:var(--gold)}
.g-title{font-family:'Grenze Gotisch',serif;font-size:26px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.g-hud{font-family:'Courier New',monospace;font-weight:700;font-size:15px;padding:7px 14px;border-radius:999px;background:rgba(12,16,6,.6);pointer-events:none}
.g-hud b{color:var(--gold)}
@media(max-width:560px){.g-title{display:none}}
</style>
</head>
<body>
<canvas id="gameCv"></canvas>
<div class="bar"><a class="nav-btn" href="index.html">← Accueil</a><span class="g-title">Swamp game</span><span class="g-hud">SCORE <b id="gScore">00000</b> &nbsp; RECORD <b id="gHi">00000</b></span></div>
<script>
const $=s=>document.querySelector(s);
(function(){
const K=2,TW=320,G=0.28;                       /* K = définition : 2x plus de pixels */
let GW=320,GH=100,GY=84,S=6,seed=7;
const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const sn=v=>Math.round(v*K)/K;
const cv=$('#gameCv'),cx=cv.getContext('2d');
function C(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*K);c.height=Math.ceil(h*K);c.getContext('2d').scale(K,K);return c}
const blit=(c,x,y)=>cx.drawImage(c,x,y,c.width/K,c.height/K);
/* --- sprites : dessin 12px -> agrandi x2 (Scale2x) + contour sombre --- */
function mk(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 rows.forEach((r,y)=>{for(let x=0;x<w;x++){const k=r[x];if(pal[k]){g.fillStyle=pal[k];g.fillRect(x,y,1,1)}}});return c}
function up(src){const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
 const px=(x,y)=>{x=Math.max(0,Math.min(w-1,x));y=Math.max(0,Math.min(h-1,y));const i=(y*w+x)*4;return d[i+3]<8?0:((d[i]<<16)|(d[i+1]<<8)|d[i+2])+1};
 const W=w*2+2,H=h*2+2,o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d'),od=g.createImageData(W,H),dd=od.data;
 const put=(x,y,v)=>{if(!v)return;const i=(y*W+x)*4,c=v-1;dd[i]=c>>16;dd[i+1]=(c>>8)&255;dd[i+2]=c&255;dd[i+3]=255};
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const P=px(x,y),A=px(x,y-1),B=px(x+1,y),L=px(x-1,y),D=px(x,y+1);
  put(2*x+1,2*y+1,(L==A&&L!=D&&A!=B)?A:P);put(2*x+2,2*y+1,(A==B&&A!=L&&B!=D)?B:P);
  put(2*x+1,2*y+2,(D==L&&D!=B&&L!=A)?L:P);put(2*x+2,2*y+2,(B==D&&B!=A&&D!=L)?D:P)}
 const al=(x,y)=>x<0||y<0||x>=W||y>=H?0:dd[(y*W+x)*4+3];
 const edge=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!al(x,y)&&(al(x-1,y)||al(x+1,y)||al(x,y-1)||al(x,y+1)))edge.push((y*W+x)*4)}
 edge.forEach(i=>{dd[i]=18;dd[i+1]=12;dd[i+2]=4;dd[i+3]=235});
 g.putImageData(od,0,0);o.lw=w;o.lh=h;return o}
const spr=(rows,pal)=>up(mk(rows,pal));
const dr=(c,x,y)=>cx.drawImage(c,x-.5,y-.5,c.width/K,c.height/K);
const mir=rows=>rows.map(r=>r.split('').reverse().join(''));
/* l'Âne (joueur) */
const PD={a:'#8c8794',l:'#cfc9c0',K:'#1a1208',d:'#4d4a55'};
const HEAD=['.aa.aa........','.aaaaa........','llaKaa........','lllaaaaaaaaaa.','.llaaaaaaaaaaa','...aaaaaaaaaaa','...aaaaaaaaaad','...aaaaaaaaaa.'];
const runA=spr(mir([...HEAD,'...a.a....a.a.','...d.d....d.d.','...d.d....d.d.']),PD),runB=spr(mir([...HEAD,'...aa.....aa..','...dd.....dd..','..dd.......dd.']),PD);
const DUCK=['.aa.aa........','llaKaaaaaaaaa.','lllaaaaaaaaaad','.llaaaaaaaaaa.','..aaaaaaaaaaa.'];
const duckA=spr(mir([...DUCK,'..a.a....a.a..','..d.d....d.d..']),PD),duckB=spr(mir([...DUCK,'...aa.....aa..','..dd.......dd.']),PD);
const PH=11,PDH=7;
/* obstacles */
const PS={G:'#9bc53d',g:'#9bc53d',K:'#1a1208',M:'#5a1e14',V:'#5a3d22',S:'#d8cfa6',P:'#6a4a2a',B:'#231710'};
const TOP=['..GGGGGGGG..','.GGGGGGGGGG.','gGGKGGGKGGGg','.GGGGGGGGGG.','.GGGGMMGGGG.','..GGGGGGGG..','.VVVVSSVVVV.','GVVVSSSSVVVG','GVVSSSSSSVVG','.VSSSSSSSSV.','..SSSSSSSS..','..PPPPPPPP..'];
const shrek=spr([...TOP,'..PPP..PPP..','.PPP....PPP.','BBBB....BBB.'],PS);
const stump=spr(['..MMMMMM..','.MwwwwwwM.','.WWWWWWWW.','.WWwWWwWW.','.WWWWWWWW.','WWWWWWWWWW','WWWWWWWWWW'],{M:'#5f8a2a',w:'#8a6a3a',W:'#6b4a2a'});
const rock=spr(['...rrrr...','..rRRRRR..','.rRRRRRRR.','RRRRdRRRRR','RRRRRRRRdR','dRRRRRRRRR'],{r:'#a0a5aa',R:'#7a7f84',d:'#5a5f64'});
const shroom=spr(['..CCCC..','.CCWCCC.','CCCCCWCC','CCCCCCCC','..TTTT..','..TTTT..','..TTTT..'],{C:'#b03a3a',W:'#f3ecd0',T:'#e6dcc0'});
const gingy=spr(['..gggg..','.gKggKg.','.gggggg.','gggiiggg','.gggggg.','..gggg..','..g..g..','..g..g..'],{g:'#c27a3a',K:'#3a1e0a',i:'#f6f0e0'});
const puss=spr(['..HHHHH...','.oooooooo.','.oKooooKo.','.oooooooo.','..oooooo..','.oooooooo.','.oooooooo.','..oo..oo..','..BB..BB..','.BBB..BBB.'],{H:'#5a3a1f',o:'#e08a2a',K:'#1a1208',B:'#2a1c10'});
const DR={R:'#b8443a',W:'#7a4a8a',K:'#1a1208',o:'#f0c060'};
const dragUp=spr(['........WW........','.......WWWW.......','......WWWWWW......','..RR..WWWWWW......','.RRRR.RRWWRR......','RRKRRRRRRRRRRR....','oRRRRRRRRRRRRRR...','.ooRRRRRRRRRRRRR..','..oooRRRRRRRRRRRR.','.....RR..RR..RRRRR'],DR);
const dragDn=spr(['..................','..................','..RR..............','.RRRR.RRRRRR......','RRKRRRRRRRRRRR....','oRRRRRRRRRRRRRR...','.ooRRRRRRRRRRRRR..','..oooRRRRRRRRRRRR.','......WWWWWW..RRRR','.......WWWW.......','........WW........'],DR);
/* --- décors haute définition (traits de 0,5 unité) --- */
function blob(g,x,y,rx,ry){for(let t=-ry;t<ry;t+=.5){const w=rx*Math.sqrt(1-((t+.25)/ry)**2);g.fillRect(sn(x-w),y+t,sn(w*2),.5)}}
function mound(g,x,w,h,gy){for(let t=-h;t<0;t+=.5){const ww=(w/2)*Math.sqrt(1-((t+.25)/h)**2);g.fillRect(sn(x+w/2-ww),gy+t,sn(ww*2),.5)}}
const far=C(TW,100),mid=C(TW,100),gnd=C(TW,19);
{const g=far.getContext('2d');g.fillStyle='#121a0a';let x=8;
 while(x<TW-34){const h=26+((rnd()*20)|0),top=84-h-8;g.fillRect(x,84-h,3,h);g.fillRect(x-4,top+8,4,1.5);g.fillRect(x+3,top+6,5,1.5);
  blob(g,x+1.5,top+4,11,6);blob(g,x-4,top+9,8,5);blob(g,x+7,top+9,8,5);blob(g,x+1.5,top+11,9,4);x+=22+((rnd()*18)|0)}}
{const g=mid.getContext('2d');g.fillStyle='#1c2d12';[[8,44,10],[112,34,8],[196,52,13],[274,36,9]].forEach(a=>mound(g,a[0],a[1],a[2],84));
 g.fillStyle='#2a2412';g.fillRect(66,84-36,9,30);g.fillRect(64,84-8,13,3);g.fillStyle='#2a4016';mound(g,56,30,13,84);blob(g,70.5,84-36,7.5,3);g.fillStyle='#120d06';g.fillRect(68,84-9,5,6);
 g.fillStyle='#2f4a1a';for(let i=0;i<40;i++)g.fillRect(sn(rnd()*TW),84-2-rnd()*10,.5,.5)}
{const g=gnd.getContext('2d');
 for(let x=0;x<TW;x+=.5){if(rnd()<.55){g.fillStyle=rnd()<.3?'#85b441':'#6b9a2f';const h=.5+((rnd()*3)|0)*.5;g.fillRect(x,3-h,.5,h)}}
 g.fillStyle='#85b441';g.fillRect(0,3,TW,.5);g.fillStyle='#6b9a2f';g.fillRect(0,3.5,TW,.5);g.fillStyle='#4d7422';g.fillRect(0,4,TW,2);g.fillStyle='#3b2a14';g.fillRect(0,6,TW,13);
 g.fillStyle='#33240f';for(let i=0;i<14;i++)g.fillRect(sn(rnd()*TW),8+((rnd()*9)|0),6+rnd()*10,.5);
 for(let i=0;i<240;i++){g.fillStyle=rnd()<.5?'#5b4220':'#2a1d0d';g.fillRect(sn(rnd()*TW),6.5+sn(rnd()*11),.5+((rnd()*3)|0)*.5,.5)}}
let sky;
function mixc(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function buildSky(){sky=C(GW,GH);const g=sky.getContext('2d'),cols=['#0b1207','#101a09','#16230d','#1f2d12','#2f3716','#4a4018','#6b5222'];let s2=11;const r2=()=>{s2=(s2*16807)%2147483647;return s2/2147483647};
 const N=24,bh=GY/N;for(let i=0;i<N;i++){const t=i/(N-1)*(cols.length-1),k=Math.min(cols.length-2,Math.floor(t));g.fillStyle=mixc(cols[k],cols[k+1],t-k);g.fillRect(0,sn(i*bh),GW,bh+.6)}
 g.fillStyle='#0b1207';g.fillRect(0,GY,GW,GH-GY);
 g.fillStyle='rgba(246,217,138,.07)';for(let a=40;a<GW+80;a+=70){g.beginPath();g.moveTo(a,0);g.lineTo(a+24,0);g.lineTo(a-46,GY);g.lineTo(a-82,GY);g.fill()}
 const mx=GW-58,my=Math.min(24,GY*.22);
 g.fillStyle='rgba(243,232,168,.08)';g.beginPath();g.arc(mx,my,19,0,7);g.fill();g.fillStyle='rgba(243,232,168,.10)';g.beginPath();g.arc(mx,my,14,0,7);g.fill();
 g.fillStyle='#f3e8a8';g.beginPath();g.arc(mx,my,8.5,0,7);g.fill();g.fillStyle='#d8cf8a';[[-3.5,-3,3,2],[2,2,2.5,2],[-1,3.5,1.5,1.5],[3,-4,1.5,1]].forEach(c=>g.fillRect(sn(mx+c[0]),sn(my+c[1]),c[2],c[3]));
 for(let i=0;i<GW*GY/260;i++){g.fillStyle=r2()<.2?'#fff6c8':'#e8e0b0';g.fillRect(sn(r2()*GW),sn(r2()*GY*.55),.5,.5)}}
function resize(){S=Math.max(2,Math.min(6,Math.floor(innerWidth/130)));GW=Math.ceil(innerWidth/S);GH=Math.ceil(innerHeight/S);GY=GH-16;cv.width=GW*K;cv.height=GH*K;cx.setTransform(K,0,0,K,0,0);cx.imageSmoothingEnabled=false;buildSky()}
const flies=[...Array(14)].map(()=>({x:rnd(),y:rnd(),p:rnd()*6}));
/* --- état --- */
let st='idle',dist=0,speed=2.2,score=0,hi=0,frame=0,obs=[],gap=90,raf=0,last=0,acc=0,duckKey=false;
const P={b:0,vy:0,onG:true};
try{hi=+localStorage.getItem('marais-run-hi')||0}catch(e){}
let actx=null;
function beep(f,d,t){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function reset(){obs=[];dist=0;speed=2.2;score=0;P.b=GY;P.vy=0;P.onG=true;gap=90;frame=0}
function start(){reset();st='run'}
function jump(){if(st!=='run'){start();return}if(P.onG){P.vy=-4.6;P.onG=false;beep(560,.08)}}
function spawn(){
 const types=[['stump',stump],['rock',rock],['shroom',shroom],['shrek',shrek],['gingy',gingy],['puss',puss]];
 if(score>100)types.push(['dragon'],['dragon']);
 const t=types[(Math.random()*types.length)|0];
 if(t[0]==='dragon'){const high=Math.random()<.45,bottom=high?GY-34:GY-7;obs.push({d:1,x:GW+10,y:bottom-11,w:18,h:11,v:speed+.8})}
 else{const c=t[1],n=(t[0]==='stump'||t[0]==='rock'||t[0]==='shroom')&&Math.random()<.35?2:1;obs.push({c,n,x:GW+10,y:GY-c.lh,w:c.lw*n+(n-1)*2,h:c.lh,v:speed})}
 gap=70+Math.random()*70+speed*14}
function die(){st='dead';beep(160,.25,'sawtooth');if(score>hi){hi=score;try{localStorage.setItem('marais-run-hi',String(Math.floor(hi)))}catch(e){}}}
function update(){
 frame++;speed=Math.min(6.2,2.2+score/150);dist+=speed;score+=speed*.1;
 const ducking=duckKey&&P.onG;
 if(!P.onG){P.vy+=G+(duckKey?.35:0);P.b+=P.vy;if(P.b>=GY){P.b=GY;P.vy=0;P.onG=true}}
 obs.forEach(o=>o.x-=(o.d?o.v:speed));obs=obs.filter(o=>o.x>-30);
 const l=obs[obs.length-1];if(!l||GW-l.x>gap)spawn();
 const h=ducking?PDH:PH,px=32,pw=10,top=P.b-h+2,bot=P.b-1;
 for(const o of obs){if(px+pw>o.x+2&&px<o.x+o.w-2&&bot>o.y+2&&top<o.y+o.h-1){die();return}}
}
function layer(c,f,y){const o=-((dist*f)%TW);for(let x=o;x<GW;x+=TW)blit(c,sn(x),y)}
function text(t,x,y,col){cx.font='bold 9px "Courier New",monospace';cx.textAlign='center';cx.fillStyle='#120c04';cx.fillText(t,x+.6,y+.6);cx.fillStyle=col||'#f6d98a';cx.fillText(t,x,y)}
function draw(){
 blit(sky,0,0);layer(far,.08,GY-84);layer(mid,.22,GY-84);
 flies.forEach(f=>{cx.globalAlpha=.4+.6*Math.abs(Math.sin(frame/25+f.p));cx.fillStyle='#ffe9a8';cx.fillRect(sn((f.x*GW)+Math.sin(frame/60+f.p)*6),sn((GY-18-f.y*Math.min(70,GY-20))+Math.cos(frame/50+f.p)*4),.8,.8)});cx.globalAlpha=1;
 layer(gnd,1,GY-3);
 obs.forEach(o=>{if(o.d)dr((frame>>3)&1?dragUp:dragDn,sn(o.x),sn(o.y-(((frame>>3)&1)?0:1)));else for(let i=0;i<o.n;i++)dr(o.c,sn(o.x+i*(o.c.lw+2)),o.y)});
 const ducking=duckKey&&P.onG&&st==='run',ph=(frame>>2)&1,sp=ducking?(ph?duckB:duckA):(!P.onG?runA:(ph&&st==='run'?runB:runA));
 dr(sp,30,sn(P.b-sp.lh));
 const ty=Math.round(GY*.38);
 if(st==='idle'){text('SWAMP GAME',GW/2,ty);text('SAUTER : ESPACE / TAP',GW/2,ty+14,'#d9c99d');text('S\'ACCROUPIR : BAS',GW/2,ty+25,'#d9c99d')}
 if(st==='dead'){text('PERDU !',GW/2,ty,'#e8806a');text('Les ogres ont des couches...',GW/2,ty+14,'#e8806a');text('REJOUER : ESPACE / TAP',GW/2,ty+27,'#d9c99d')}
 $('#gScore').textContent=String(Math.floor(score)).padStart(5,'0');$('#gHi').textContent=String(Math.floor(hi)).padStart(5,'0')}
function loop(t){acc+=Math.min(50,t-last);last=t;while(acc>=16.67){if(st==='run')update();else frame++;acc-=16.67}draw();raf=requestAnimationFrame(loop)}
addEventListener('resize',()=>{resize();if(st!=='run')P.b=GY;obs.forEach(o=>{if(!o.d)o.y=GY-o.h})});
addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}
 else if(e.code==='ArrowDown'){e.preventDefault();duckKey=true}});
addEventListener('keyup',e=>{if(e.code==='ArrowDown')duckKey=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(e.clientY/innerHeight>.7&&st==='run')duckKey=true;else jump()});
addEventListener('pointerup',()=>{duckKey=false});
resize();reset();last=performance.now();raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
