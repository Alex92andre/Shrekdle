<style>
:root{--cream:#f3e8c9;--gold:#e7b64f;--gold2:#f6d98a;--parch:#efe1bd;--ink:#3a2a18}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1207}
body{font-family:'Alegreya',Georgia,serif;color:var(--cream);-webkit-user-select:none;user-select:none}
#gameCv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer;display:block}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;pointer-events:none;background:linear-gradient(rgba(8,12,4,.7),transparent)}
.bar>*{pointer-events:auto}
.nav-btn{display:inline-flex;align-items:center;padding:8px 16px;border:1px solid rgba(243,232,201,.35);border-radius:999px;background:rgba(12,16,6,.6);color:var(--cream);font:700 16px 'Alegreya',serif;text-decoration:none;backdrop-filter:blur(3px);transition:.15s;cursor:pointer}
.nav-btn:hover{background:rgba(231,182,79,.2);border-color:var(--gold)}
.g-title{font-family:'Grenze Gotisch',serif;font-size:26px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.g-hud{font-family:'Courier New',monospace;font-weight:700;font-size:15px;padding:7px 14px;border-radius:999px;background:rgba(12,16,6,.6);pointer-events:none}
.g-hud b{color:var(--gold)}
.right{display:flex;align-items:center;gap:10px}
#lb{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(8,6,2,.72);backdrop-filter:blur(3px);-webkit-user-select:text;user-select:text}
#lb.on{display:flex}
.lb-box{width:min(100%,420px);background:var(--parch);color:var(--ink);border-radius:22px 28px 20px 30px/28px 20px 30px 22px;padding:20px 22px 20px;box-shadow:0 30px 70px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.5)}
.lb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lb-head h2{font-family:'Grenze Gotisch',serif;font-size:30px;font-weight:900;color:#3a2415}
#lbClose{border:1.5px solid #b89c6a;background:transparent;color:var(--ink);border-radius:12px;padding:6px 12px;font:700 15px 'Alegreya',serif;cursor:pointer}
#lbClose:hover{background:#e6d3a6}
#lbList{list-style:none;display:flex;flex-direction:column;gap:6px;min-height:60px;font-style:italic;color:#7a6244}
#lbList li{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:12px;background:#f1e2b8;border:1.5px solid #dfc994;font-style:normal;color:var(--ink);font-size:17px}
#lbList li:nth-child(1){background:#f6dc8a;border-color:#d9b24a}
#lbList li.me{outline:2px solid #5c8f2f}
#lbList .rk{font-family:'Grenze Gotisch',serif;font-weight:900;width:26px;color:#9a7a44}
#lbList .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbList b{font-family:'Courier New',monospace;color:#3a2415}
#lbForm{display:none;gap:8px;margin-top:14px}
#lbName{flex:1;min-width:0;padding:11px 14px;font:500 17px 'Alegreya',serif;color:var(--ink);background:#f7edce;border:1.5px solid #b89c6a;border-radius:12px}
#lbForm button{border:none;cursor:pointer;color:#241503;font:700 16px 'Alegreya',serif;padding:0 18px;border-radius:12px;background:linear-gradient(168deg,var(--gold2),var(--gold) 55%,#b9842c 130%)}
.lb-hint{margin-top:10px;font-size:13.5px;font-style:italic;color:#7a6244}
@media(max-width:560px){.g-title{display:none}.nav-btn{padding:7px 12px;font-size:14px}.g-hud{font-size:13px;padding:6px 10px}}
</style>
</head>
